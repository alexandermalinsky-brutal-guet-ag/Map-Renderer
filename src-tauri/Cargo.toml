[package]
name = "map-renderer"
version = "0.1.0"
description = "3D map flyover renderer (Mapbox + Three.js)"
authors = ["Brutal Güet AG"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "map_renderer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
